<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Unlocker</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Link to your custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- **** ADD FAVICON LINK HERE **** -->
    <link rel="icon" type="image/png" href="img/password_unlock.png" />
</head>
<body>
    <div class="container">
        <div class="upload-container">
            <div class="header">
                <i class="bi bi-file-earmark-pdf upload-icon"></i>
                <h1 class="h3">PDF Unlocker</h1>
                <p class="text-muted">Remove password protection from your PDF files</p>
            </div>

            <!-- Area for displaying messages -->
            <div id="message-area">
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}
            </div>

            <div class="form-container">
                <form id="upload-form" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="pdf_file" class="form-label">Select PDF file</label>
                        <input type="file" class="form-control" id="pdf_file" name="pdf_file" accept=".pdf" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">PDF Password (if needed)</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Enter the PDF password">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" id="submit-button" class="btn btn-primary btn-lg">
                            <i class="bi bi-unlock me-2"></i><span class="button-text">Unlock PDF</span>
                            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="display: none;"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <footer>
            <p>© 2025 PDF Unlocker. Maintained with ❤️ by Adithya D M.</p>
        </footer>
    </div>

    <!-- Bootstrap JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Link to your custom JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
